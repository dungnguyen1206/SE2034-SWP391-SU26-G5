<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div th:fragment="edit-service-result-modal">
        <!-- Modal Nhập/Sửa kết quả khám cận lâm sàng -->
        <div id="editResultModalWrapper" class="modal-overlay" style="display: none;">
            <div class="modal-card result-modal-card">
                <div class="modal-header result-modal-header">
                    <h2 class="result-modal-title">
                        <i class="fa-solid fa-square-poll-horizontal text-blue"></i> Cập nhật kết quả khám
                    </h2>
                    <button type="button" onclick="closeEditResultModal()"
                        class="btn-close-modal result-modal-close">&times;</button>
                </div>
                <form th:action="@{/doctor/appointments/{id}/services/save-result-placeholder(id=${appointment.id})}"
                    method="POST" id="editResultForm">
                    <div class="modal-body result-modal-body">
                        <div class="result-modal-group">
                            <span class="result-modal-label-sm">Dịch vụ chỉ định:</span>
                            <strong id="resultModalServiceName" class="result-modal-value-lg">Tên dịch vụ</strong>
                        </div>
                        <div class="form-group result-modal-group">
                            <label for="serviceNoteTextarea" class="result-modal-label">Ghi chú <span class="text-red">*</span></label>
                            <input type="text" name="note" id="serviceNoteTextarea"
                                placeholder="Ví dụ: Triệu chứng hồi hộp, đánh trống ngực..." class="result-modal-input"
                                required maxlength="500"
                                oninvalid="validateNoteField(this)" oninput="validateNoteField(this)">
                        </div>
                        <div class="form-group">
                            <label for="serviceResultTextarea" class="result-modal-label">Kết quả khám <span class="text-red">*</span></label>
                            <textarea name="result" id="serviceResultTextarea"
                                placeholder="Nhập kết quả chi tiết của dịch vụ khám này..." rows="5"
                                class="result-modal-input" required maxlength="500"
                                oninvalid="validateResultField(this)" oninput="validateResultField(this)"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer result-modal-footer">
                        <button type="button" onclick="closeEditResultModal()"
                             class="btn-cancel btn-result-cancel">Hủy</button>
                        <button type="submit" class="btn-submit btn-result-submit">Lưu kết quả</button>
                    </div>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            if (typeof openEditResultModal !== 'function') {
                function openEditResultModal(orderId, serviceName, currentResult, currentNote) {
                    document.getElementById('resultModalServiceName').textContent = serviceName;

                    const form = document.getElementById('editResultForm');
                    const appointmentId = [[${appointment.id}]];
                    form.action = '/doctor/appointments/' + appointmentId + '/services/' + orderId + '/result';

                    document.getElementById('serviceNoteTextarea').value = currentNote || '';
                    document.getElementById('serviceResultTextarea').value = currentResult || '';
                    
                    // Reset validity status
                    document.getElementById('serviceNoteTextarea').setCustomValidity('');
                    document.getElementById('serviceResultTextarea').setCustomValidity('');
                    
                    document.getElementById('editResultModalWrapper').style.display = 'flex';
                }
            }

            if (typeof closeEditResultModal !== 'function') {
                function closeEditResultModal() {
                    document.getElementById('editResultModalWrapper').style.display = 'none';
                }
            }

            if (typeof validateResultField !== 'function') {
                function validateResultField(inputElement) {
                    const value = inputElement.value.trim();
                    if (!value) {
                        inputElement.setCustomValidity('Kết quả khám không được để trống');
                    } else if (value.length > 500) {
                        inputElement.setCustomValidity('Kết quả khám không được vượt quá 500 ký tự');
                    } else {
                        inputElement.setCustomValidity('');
                    }
                }
            }

            if (typeof validateNoteField !== 'function') {
                function validateNoteField(inputElement) {
                    const value = inputElement.value.trim();
                    if (!value) {
                        inputElement.setCustomValidity('Ghi chú không được để trống');
                    } else if (value.length > 500) {
                        inputElement.setCustomValidity('Ghi chú không được vượt quá 500 ký tự');
                    } else {
                        inputElement.setCustomValidity('');
                    }
                }
            }
        </script>
    </div>
</body>
</html>
