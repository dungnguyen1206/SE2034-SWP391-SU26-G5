<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/manager/fragments/layout}"
      th:with="pageTitle='Danh sách bài viết y tế', pageSubtitle='Quản lý bài viết y tế trên hệ thống', activeMenu='articles'">

<head>
    <meta charset="UTF-8">
    <title>Danh sách bài viết</title>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/manager/manager-articles.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">

        <!-- Thông báo sau khi thao tác -->
        <div th:if="${successMessage}" class="alert-message alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert-message alert-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Thanh công cụ: số bài viết + nút tạo mới -->
        <div class="article-toolbar">
            <p class="article-count">
                <span th:text="${totalItems}">0</span> bài viết
            </p>
            <a th:href="@{/manager/articles/create}" class="article-create-button">
                <i class="bi bi-plus-lg"></i> Viết bài mới
            </a>
        </div>

        <!-- Tìm kiếm và bộ lọc -->
        <form class="article-filter-card" th:action="@{/manager/articles}" method="get">
            <div class="article-search-box">
                <i class="bi bi-search"></i>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm bài viết theo tiêu đề...">
                <button type="submit" class="hidden-submit"></button>
            </div>
            
            <div class="article-filter-row">
                <div class="filter-group">
                    <span class="filter-label">Chuyên mục:</span>
                    <select name="category" class="form-control filter-select">
                        <option value="" th:selected="${category == null or category == ''}">Tất cả</option>
                        <!-- Chuyên mục lấy từ enum ArticleCategory -->
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"
                                th:selected="${category == cat}"></option>
                    </select>
                </div>

                <div class="filter-group">
                    <span class="filter-label">Trạng thái:</span>
                    <select name="status" class="form-control filter-select">
                        <option value="" th:selected="${status == null or status == ''}">Tất cả</option>
                        <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">Đã xuất bản</option>
                        <option value="DRAFT" th:selected="${status == 'DRAFT'}">Bản nháp</option>
                    </select>
                </div>

                <!-- Bấm để áp dụng bộ lọc, thay cho việc tự gửi form khi chọn -->
                <div class="filter-group">
                    <button type="submit" class="filter-apply-btn">Lọc</button>
                </div>

                <div class="filter-group filter-group-right">
                    <a th:href="@{/manager/articles}" class="filter-clear-link">Xóa lọc</a>
                </div>
            </div>
        </form>

        <!-- Danh sách thẻ bài viết -->
        <div class="article-list-container">
            
            <div th:each="article : ${articleList}" class="article-card">
                <div class="article-card-left">
                    <div th:if="${article.thumbnailUrl != null}" class="article-thumb">
                        <img th:src="${article.thumbnailUrl}" th:alt="${article.title}">
                    </div>
                    <div th:if="${article.thumbnailUrl == null}" class="article-thumb empty">
                        <i class="bi bi-image"></i>
                    </div>

                    <div class="article-info">
                        <a th:href="@{'/manager/articles/detail/' + ${article.id}}" class="article-title" th:text="${article.title}">Tiêu đề bài viết</a>
                        <div class="article-meta">
                            <span class="meta-category" th:text="${article.category}">Chuyên mục</span>
                            <span class="meta-separator">•</span>
                            <span>Bởi <span th:text="${article.authorName}">Tác giả</span></span>
                            <span class="meta-separator">•</span>
                            <span th:text="${article.createdAt != null ? #temporals.format(article.createdAt, 'dd/MM/yyyy') : ''}">2026-05-15</span>
                        </div>
                    </div>
                </div>
                <div class="article-card-right">
                    <span class="status-badge" th:classappend="${article.status == 'PUBLISHED'} ? 'published' : 'draft'"
                          th:text="${article.status == 'PUBLISHED'} ? 'Đã xuất bản' : 'Bản nháp'">
                    </span>
                    <div class="card-actions">
                        <a th:href="@{'/manager/articles/detail/' + ${article.id}}" class="action-btn" title="Xem chi tiết"><i class="bi bi-eye"></i></a>
                        <a th:href="@{'/manager/articles/edit/' + ${article.id}}" class="action-btn" title="Chỉnh sửa"><i class="bi bi-pencil-square"></i></a>
                        <a th:href="'#confirm-delete-' + ${article.id}" class="action-btn delete" title="Xóa"><i class="bi bi-trash"></i></a>

                        <!-- Hộp thoại xác nhận, chỉ hiện khi địa chỉ trên trình duyệt trỏ đúng vào id này -->
                        <div class="confirm-overlay" th:id="'confirm-delete-' + ${article.id}">
                            <div class="confirm-box">
                                <p class="confirm-text">Bạn có chắc chắn muốn xóa bài viết này không?</p>
                                <div class="confirm-actions">
                                    <a href="#" class="confirm-btn cancel">Hủy</a>
                                    <form th:action="@{'/manager/articles/delete/' + ${article.id}}" method="post">
                                        <button type="submit" class="confirm-btn danger">Xóa</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Khi không có dữ liệu -->
            <div th:if="${#lists.isEmpty(articleList)}" class="article-empty-state">
                <i class="bi bi-folder-x"></i>
                <p>Không có bài viết nào.</p>
            </div>

        </div>

        <!-- Phân trang -->
        <div th:if="${totalPages > 1}" class="article-pagination">
            <span class="pagination-info"
                  th:text="'Trang ' + ${currentPage} + ' / ' + ${totalPages}"></span>

            <!-- Nút lùi một trang, đang ở trang đầu thì để mờ và không bấm được -->
            <a th:if="${currentPage > 1}" class="pager-button"
               th:href="@{/manager/articles(keyword=${keyword}, category=${category}, status=${status}, page=${currentPage - 1})}">
                <i class="bi bi-chevron-left"></i> Trước
            </a>
            <span th:unless="${currentPage > 1}" class="pager-button disabled">
                <i class="bi bi-chevron-left"></i> Trước
            </span>

            <!-- Luôn hiện trang đầu -->
            <a class="pager-button" th:classappend="${currentPage == 1} ? 'active' : ''"
               th:href="@{/manager/articles(keyword=${keyword}, category=${category}, status=${status}, page=1)}">1</a>

            <!-- Dấu ba chấm bên trái -->
            <span th:if="${showLeftDots}" class="pager-dots">...</span>

            <!-- Các trang quanh trang hiện tại, danh sách do controller tính sẵn -->
            <a th:each="page : ${middlePages}" class="pager-button"
               th:classappend="${currentPage == page} ? 'active' : ''" th:text="${page}"
               th:href="@{/manager/articles(keyword=${keyword}, category=${category}, status=${status}, page=${page})}"></a>

            <!-- Dấu ba chấm bên phải -->
            <span th:if="${showRightDots}" class="pager-dots">...</span>

            <!-- Luôn hiện trang cuối -->
            <a class="pager-button" th:classappend="${currentPage == totalPages} ? 'active' : ''" th:text="${totalPages}"
               th:href="@{/manager/articles(keyword=${keyword}, category=${category}, status=${status}, page=${totalPages})}"></a>

            <!-- Nút tiến một trang -->
            <a th:if="${currentPage < totalPages}" class="pager-button"
               th:href="@{/manager/articles(keyword=${keyword}, category=${category}, status=${status}, page=${currentPage + 1})}">
                Sau <i class="bi bi-chevron-right"></i>
            </a>
            <span th:unless="${currentPage < totalPages}" class="pager-button disabled">
                Sau <i class="bi bi-chevron-right"></i>
            </span>
        </div>

</div>
</body>
</html>
