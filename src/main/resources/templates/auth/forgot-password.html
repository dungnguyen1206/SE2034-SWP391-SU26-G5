<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - HAMS</title>
    <!-- Thư viện icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Đường dẫn CSS: bản xem trước tĩnh và bản Thymeleaf -->
    <link rel="stylesheet" href="../../static/css/auth/auth.css" th:href="@{/css/auth/auth.css}">
</head>
<body>
    <!-- Nút quay về trang chủ -->
    <a href="/" class="btn-guest-home">
        <i class="fa-solid fa-house"></i> Về trang chủ
    </a>

    <div class="auth-container">
        <!-- Bên trái: thẻ quên mật khẩu -->
        <div class="auth-left">
            <div class="auth-card">
                <h2 class="auth-card-title">Quên mật khẩu</h2>
                <p class="auth-card-subtitle">
                    Nhập thông tin của bạn để nhận mã xác minh đặt lại mật khẩu.
                </p>
                
                <!-- Các thông báo -->
                <div th:if="${error != null}" class="auth-alert error">
                    <i class="fa-solid fa-circle-exclamation"></i> 
                    <span th:text="${error}">Lỗi gửi mail</span>
                </div>
                
                <form th:action="@{/forgot-password}" method="POST">
                    <!-- Chọn kênh nhận mã OTP -->
                    <div class="otp-channel-group">
                        <label class="input-label">Nhận mã OTP qua</label>
                        <div class="otp-channel-options">
                            <div class="otp-channel-option">
                                <input type="radio" id="channelEmail" name="otpChannel" value="email" checked>
                                <label for="channelEmail">
                                    <i class="fa-solid fa-envelope"></i> Email
                                </label>
                            </div>
                            <div class="otp-channel-option">
                                <input type="radio" id="channelSms" name="otpChannel" value="sms">
                                <label for="channelSms">
                                    <i class="fa-solid fa-comment-sms"></i> SMS
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Ô nhập email, dùng khi chọn nhận mã qua Email -->
                    <div class="input-group">
                        <label class="input-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="auth-input" placeholder="Nhập địa chỉ Email của bạn" autofocus>
                    </div>

                    <!-- Ô nhập số điện thoại, dùng khi chọn nhận mã qua SMS -->
                    <div class="input-group">
                        <label class="input-label" for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" name="phone" class="auth-input" placeholder="Nhập số điện thoại của bạn">
                    </div>
                    
                    <!-- Nút gửi mã -->
                    <div class="auth-footer-actions">
                        <button type="submit" class="auth-btn auth-btn-block">Gửi mã xác minh</button>
                    </div>
                </form>
                
                <!-- Liên kết quay lại đăng nhập -->
                <div class="auth-nav-hint">
                    <a href="login.html" th:href="@{/login}">
                        <i class="fa-solid fa-arrow-left back-arrow-icon"></i>
                        Quay lại Đăng nhập
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Bên phải: logo và ảnh minh họa -->
        <div class="auth-right">
            <div class="auth-logo-top">
                <span class="logo-circle"></span>
                <span>HAMS</span>
            </div>
            
            <div class="auth-illustration-container">
                <img src="../../static/images/khoa-san-benh-vien-fv-2022.jpg" th:src="@{/images/khoa-san-benh-vien-fv-2022.jpg}" alt="HAMS Illustration" class="auth-illustration">
            </div>
        </div>
    </div>

</body>
</html>
